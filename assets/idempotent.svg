<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2328">群级幂等补丁解决了什么</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#57606a">中途断线后，是「只补剩下的」还是「35 个群全部重签一遍」</text>

  <!-- 上半：原版 -->
  <rect x="40" y="88" width="880" height="176" rx="12" fill="#fff5f5" stroke="#cf222e" stroke-width="1.6"/>
  <text x="60" y="114" font-size="14" font-weight="700" fill="#a40e26">原版：签到记录整轮结束才落盘</text>

  <text x="60" y="150" font-size="12" fill="#57606a">第 1 轮</text>
  <g>
    <rect x="150" y="136" width="26" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37"/><text x="163" y="151" text-anchor="middle" font-size="10" fill="#116329">1</text>
    <rect x="180" y="136" width="26" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37"/><text x="193" y="151" text-anchor="middle" font-size="10" fill="#116329">2</text>
    <rect x="210" y="136" width="26" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37"/><text x="223" y="151" text-anchor="middle" font-size="10" fill="#116329">3</text>
    <rect x="240" y="136" width="26" height="22" rx="4" fill="#ffebe9" stroke="#cf222e"/><text x="253" y="151" text-anchor="middle" font-size="10" fill="#a40e26">×</text>
    <rect x="270" y="136" width="26" height="22" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="283" y="151" text-anchor="middle" font-size="10" fill="#8c959f">?</text>
    <rect x="300" y="136" width="26" height="22" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="313" y="151" text-anchor="middle" font-size="10" fill="#8c959f">?</text>
    <text x="345" y="152" font-size="12" fill="#cf222e">← 第 4 个群时断线，这一轮进度全丢</text>
  </g>

  <text x="60" y="202" font-size="12" fill="#57606a">重启后</text>
  <g>
    <rect x="150" y="188" width="26" height="22" rx="4" fill="#ffebe9" stroke="#cf222e"/><text x="163" y="203" text-anchor="middle" font-size="10" fill="#a40e26">1</text>
    <rect x="180" y="188" width="26" height="22" rx="4" fill="#ffebe9" stroke="#cf222e"/><text x="193" y="203" text-anchor="middle" font-size="10" fill="#a40e26">2</text>
    <rect x="210" y="188" width="26" height="22" rx="4" fill="#ffebe9" stroke="#cf222e"/><text x="223" y="203" text-anchor="middle" font-size="10" fill="#a40e26">3</text>
    <rect x="240" y="188" width="26" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37"/><text x="253" y="203" text-anchor="middle" font-size="10" fill="#116329">4</text>
    <rect x="270" y="188" width="26" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37"/><text x="283" y="203" text-anchor="middle" font-size="10" fill="#116329">…</text>
    <rect x="300" y="188" width="26" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37"/><text x="313" y="203" text-anchor="middle" font-size="10" fill="#116329">35</text>
    <text x="345" y="204" font-size="12" fill="#cf222e">← 1/2/3 被重复签到，容易被判异常</text>
  </g>
  <text x="60" y="245" font-size="11" fill="#a40e26">根因：persist_sign_record() 在整轮 for 循环之后才调用一次</text>

  <!-- 下半：补丁 -->
  <rect x="40" y="282" width="880" height="176" rx="12" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.6"/>
  <text x="60" y="308" font-size="14" font-weight="700" fill="#116329">补丁：每签完一个群立刻落盘 progress/&lt;user&gt;-&lt;date&gt;.json</text>

  <text x="60" y="344" font-size="12" fill="#57606a">第 1 轮</text>
  <g>
    <rect x="150" y="330" width="26" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37"/><text x="163" y="345" text-anchor="middle" font-size="10" fill="#116329">1</text>
    <rect x="180" y="330" width="26" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37"/><text x="193" y="345" text-anchor="middle" font-size="10" fill="#116329">2</text>
    <rect x="210" y="330" width="26" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37"/><text x="223" y="345" text-anchor="middle" font-size="10" fill="#116329">3</text>
    <rect x="240" y="330" width="26" height="22" rx="4" fill="#ffebe9" stroke="#cf222e"/><text x="253" y="345" text-anchor="middle" font-size="10" fill="#a40e26">×</text>
    <rect x="270" y="330" width="26" height="22" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="283" y="345" text-anchor="middle" font-size="10" fill="#8c959f">?</text>
    <rect x="300" y="330" width="26" height="22" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><text x="313" y="345" text-anchor="middle" font-size="10" fill="#8c959f">?</text>
    <text x="345" y="346" font-size="12" fill="#1a7f37">← 1/2/3 已经写入进度文件</text>
  </g>

  <text x="60" y="396" font-size="12" fill="#57606a">重启后</text>
  <g>
    <rect x="150" y="382" width="26" height="22" rx="4" fill="#eceef1" stroke="#8c959f"/><text x="163" y="397" text-anchor="middle" font-size="10" fill="#57606a">✓</text>
    <rect x="180" y="382" width="26" height="22" rx="4" fill="#eceef1" stroke="#8c959f"/><text x="193" y="397" text-anchor="middle" font-size="10" fill="#57606a">✓</text>
    <rect x="210" y="382" width="26" height="22" rx="4" fill="#eceef1" stroke="#8c959f"/><text x="223" y="397" text-anchor="middle" font-size="10" fill="#57606a">✓</text>
    <rect x="240" y="382" width="26" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37"/><text x="253" y="397" text-anchor="middle" font-size="10" fill="#116329">4</text>
    <rect x="270" y="382" width="26" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37"/><text x="283" y="397" text-anchor="middle" font-size="10" fill="#116329">…</text>
    <rect x="300" y="382" width="26" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37"/><text x="313" y="397" text-anchor="middle" font-size="10" fill="#116329">35</text>
    <text x="345" y="398" font-size="12" fill="#1a7f37">← 跳过已签群，只补 4~35</text>
  </g>
  <text x="60" y="439" font-size="11" fill="#116329">原子写 · 幂等可回滚 · CSP_SIGN_FORCE=1 可强制全签 · 10 天前进度自动清理</text>

  <rect x="60" y="478" width="840" height="24" rx="6" fill="#f6f8fa"/>
  <text x="480" y="494" text-anchor="middle" font-size="11" fill="#57606a">自检脚本 selftest_skip.py 用 FakeApp 跑真实 normal_run，验证「签剩余 5 → 重启签 0 → 清空进度签全部」三个场景</text>
</svg>
