<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>

  <text x="480" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2328">一体化部署架构</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#57606a">一个容器，两个子进程，共用一份配置</text>

  <!-- 宿主机巡检层 -->
  <rect x="60" y="88" width="840" height="76" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="76" y="104" width="150" height="44" rx="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="151" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#0550ae">宿主机 crontab</text>
  <text x="151" y="139" text-anchor="middle" font-size="11" fill="#0550ae">*/30 * * * *</text>
  <path d="M226 126 L296 126" stroke="#0969da" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <rect x="300" y="104" width="250" height="44" rx="7" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="425" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">patrol/monitor.sh</text>
  <text x="425" y="139" text-anchor="middle" font-size="11" fill="#57606a">L0 代理 · L1 容器 · L2 崩溃环 · L3 完成度</text>
  <path d="M550 126 L620 126" stroke="#0969da" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <rect x="624" y="104" width="260" height="44" rx="7" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="754" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#7d4e00">WxPusher 告警</text>
  <text x="754" y="139" text-anchor="middle" font-size="11" fill="#7d4e00">异常自愈 + 同日同类只推一次</text>

  <!-- 容器外框 -->
  <rect x="60" y="192" width="840" height="290" rx="14" fill="#f0f6fc" stroke="#0969da" stroke-width="2"/>
  <rect x="60" y="192" width="840" height="38" rx="14" fill="#ddf4ff" stroke="none"/>
  <path d="M60 230 L900 230" stroke="#0969da" stroke-width="1.5"/>
  <text x="80" y="217" font-size="14" font-weight="700" fill="#0550ae">Docker 容器 · tg-signer-runner</text>
  <text x="880" y="217" text-anchor="end" font-size="12" fill="#0550ae">--network host · restart: unless-stopped</text>

  <!-- entrypoint -->
  <rect x="84" y="250" width="792" height="36" rx="7" fill="#ffffff" stroke="#0969da" stroke-width="1.3"/>
  <text x="480" y="273" text-anchor="middle" font-size="13" font-weight="600" fill="#0550ae">container/entrypoint-all.sh  ·  1 号进程：拉起两个子进程 + 每 10s 比对 md5 + 进程判活</text>

  <!-- WebUI 子进程 -->
  <rect x="84" y="306" width="360" height="118" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.8"/>
  <rect x="84" y="306" width="360" height="30" rx="9" fill="#fbefff"/>
  <path d="M84 336 L444 336" stroke="#8250df" stroke-width="1"/>
  <text x="264" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#6639ba">子进程 A · WebUI</text>
  <text x="100" y="356" font-size="12" fill="#1f2328">tg-signer webgui -H 0.0.0.0 -P 9090</text>
  <text x="100" y="378" font-size="12" fill="#57606a">不连 Telegram，无 pyrogram / subprocess</text>
  <text x="100" y="400" font-size="12" fill="#57606a">只读 + 写 config.json，纯文件编辑器</text>

  <!-- Runner 子进程 -->
  <rect x="516" y="306" width="360" height="118" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8"/>
  <rect x="516" y="306" width="360" height="30" rx="9" fill="#dafbe1"/>
  <path d="M516 336 L876 336" stroke="#1a7f37" stroke-width="1"/>
  <text x="696" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#1a7f37">子进程 B · Runner</text>
  <text x="532" y="356" font-size="12" fill="#1f2328">tg-signer ... -a &lt;account&gt; run &lt;task&gt;</text>
  <text x="532" y="378" font-size="12" fill="#57606a">唯一持有会话；croniter 进程内自调度</text>
  <text x="532" y="400" font-size="12" fill="#57606a">启动时读一次 config，靠热重载更新</text>

  <!-- 中间连接 -->
  <path d="M444 365 L516 365" stroke="#bf8700" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arr2)"/>
  <text x="480" y="356" text-anchor="middle" font-size="10" fill="#7d4e00">md5</text>

  <!-- 底部提示条 -->
  <rect x="84" y="440" width="792" height="28" rx="6" fill="#fff8c5"/>
  <text x="480" y="459" text-anchor="middle" font-size="12" fill="#7d4e00">23:50–00:40 签到窗口内不重载，标记 PENDING，窗口结束后补做</text>

  <!-- 共享卷 -->
  <rect x="60" y="508" width="500" height="88" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="310" y="532" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">持久化卷 ./data → /data</text>
  <text x="310" y="553" text-anchor="middle" font-size="12" fill="#57606a">.signer/signs/&lt;task&gt;/config.json · users/ · sessions/ · _patch/</text>
  <text x="310" y="574" text-anchor="middle" font-size="11" fill="#6e7781">容器重建不影响数据；webgui 与 runner 读写同一份配置</text>

  <!-- 输出 -->
  <rect x="580" y="508" width="320" height="88" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="740" y="532" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">可观测输出</text>
  <text x="740" y="553" text-anchor="middle" font-size="12" fill="#57606a">/var/log/tg_checkin.log → 日报</text>
  <text x="740" y="574" text-anchor="middle" font-size="12" fill="#57606a">/var/log/tg-signer-all.log → 入口日志</text>

  <path d="M310 508 L310 482" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>
  <path d="M740 508 L740 482" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0969da"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#bf8700"/>
    </marker>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/>
    </marker>
  </defs>
</svg>
