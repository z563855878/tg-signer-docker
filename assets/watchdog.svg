<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2328">看门狗的四层检查</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#57606a">每层独立降级，从网络一路查到「今天到底签没签」</text>

  <!-- L0 -->
  <rect x="60" y="88" width="840" height="92" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <rect x="60" y="88" width="72" height="92" rx="10" fill="#0969da"/>
  <rect x="108" y="88" width="24" height="92" fill="#0969da"/>
  <text x="96" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">L0</text>
  <text x="158" y="114" font-size="14" font-weight="700" fill="#0550ae">代理层</text>
  <text x="158" y="136" font-size="12" fill="#1f2328">经 TG_PROXY_URL 探测 api.telegram.org</text>
  <text x="158" y="158" font-size="11" fill="#57606a">本机 Clash：重钉节点 → 刷订阅 → 重启；远程代理：只探测 + 告警</text>
  <text x="880" y="137" text-anchor="end" font-size="11" fill="#0550ae">未配置则整层跳过</text>

  <!-- L1 -->
  <rect x="60" y="194" width="840" height="92" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <rect x="60" y="194" width="72" height="92" rx="10" fill="#1a7f37"/>
  <rect x="108" y="194" width="24" height="92" fill="#1a7f37"/>
  <text x="96" y="243" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">L1</text>
  <text x="158" y="220" font-size="14" font-weight="700" fill="#116329">容器层</text>
  <text x="158" y="242" font-size="12" fill="#1f2328">tg-signer-runner 必须 running</text>
  <text x="158" y="264" font-size="11" fill="#57606a">停了就 start；容器消失则按 deploy/runner.create.sh 原样重建</text>
  <text x="880" y="243" text-anchor="end" font-size="11" fill="#116329">名字不能改</text>

  <!-- L2 -->
  <rect x="60" y="300" width="840" height="92" rx="10" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
  <rect x="60" y="300" width="72" height="92" rx="10" fill="#bf8700"/>
  <rect x="108" y="300" width="24" height="92" fill="#bf8700"/>
  <text x="96" y="349" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">L2</text>
  <text x="158" y="326" font-size="14" font-weight="700" fill="#7d4e00">崩溃环</text>
  <text x="158" y="348" font-size="12" fill="#1f2328">RestartCount 持续增长 → 校验启动参数</text>
  <text x="158" y="370" font-size="11" fill="#57606a">缺 --session_dir 会退化成交互式登录 → EOF → 崩溃循环；缺则重建</text>
  <text x="880" y="349" text-anchor="end" font-size="11" fill="#7d4e00">入口脚本另有 120s 退避</text>

  <!-- L3 -->
  <rect x="60" y="406" width="840" height="92" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <rect x="60" y="406" width="72" height="92" rx="10" fill="#8250df"/>
  <rect x="108" y="406" width="24" height="92" fill="#8250df"/>
  <text x="96" y="455" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">L3</text>
  <text x="158" y="432" font-size="14" font-weight="700" fill="#6639ba">完成度</text>
  <text x="158" y="454" font-size="12" fill="#1f2328">00:20 后检查当日日志有无「下次运行时间」</text>
  <text x="158" y="476" font-size="11" fill="#57606a">没有 → 重启 + 告警；有 → 校验「开始执行」块数是否等于配置群数</text>
  <text x="880" y="455" text-anchor="end" font-size="11" fill="#6639ba">统计含轮转日志</text>

  <text x="480" y="526" text-anchor="middle" font-size="11" fill="#57606a">告警只推 WxPusher，同日同类只推一次，恢复正常后清除标记 · 日志 /var/log/tg-signer-monitor.log</text>
</svg>
