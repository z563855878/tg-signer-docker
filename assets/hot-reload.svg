<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2328">配置改完，几秒内生效</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#57606a">entrypoint 每 10 秒比对 md5，只重启 runner，不动 WebUI</text>

  <!-- 时间轴基线 -->
  <path d="M60 118 L900 118" stroke="#d0d7de" stroke-width="2" fill="none" marker-end="url(#tl)"/>

  <!-- 4 个节点 -->
  <circle cx="130" cy="118" r="8" fill="#8250df"/>
  <circle cx="370" cy="118" r="8" fill="#0969da"/>
  <circle cx="610" cy="118" r="8" fill="#bf8700"/>
  <circle cx="850" cy="118" r="8" fill="#1a7f37"/>

  <rect x="62" y="142" width="180" height="66" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="152" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#6639ba">t + 0s</text>
  <text x="152" y="185" text-anchor="middle" font-size="12" fill="#1f2328">WebUI 点「保存」</text>
  <text x="152" y="201" text-anchor="middle" font-size="11" fill="#57606a">config.json 被写入</text>

  <rect x="302" y="142" width="180" height="66" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="392" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#0550ae">t + ≤10s</text>
  <text x="392" y="185" text-anchor="middle" font-size="12" fill="#1f2328">md5 变化被发现</text>
  <text x="392" y="201" text-anchor="middle" font-size="11" fill="#57606a">CUR != LAST</text>

  <rect x="542" y="142" width="180" height="66" rx="8" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
  <text x="632" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#7d4e00">判断</text>
  <text x="632" y="185" text-anchor="middle" font-size="12" fill="#1f2328">是否在签到窗口</text>
  <text x="632" y="201" text-anchor="middle" font-size="11" fill="#57606a">23:50 – 00:40</text>

  <rect x="782" y="142" width="140" height="66" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="852" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#116329">生效</text>
  <text x="852" y="185" text-anchor="middle" font-size="12" fill="#1f2328">新配置被使用</text>
  <text x="852" y="201" text-anchor="middle" font-size="11" fill="#57606a">网页不掉线</text>

  <!-- 两条分支 -->
  <path d="M632 208 L632 260 L330 260 L330 296" stroke="#1a7f37" stroke-width="1.8" fill="none" marker-end="url(#gr)"/>
  <text x="470" y="253" text-anchor="middle" font-size="12" font-weight="600" fill="#116329">窗口外 · 立即重载</text>

  <path d="M632 208 L632 296" stroke="#bf8700" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#or)"/>
  <text x="700" y="253" text-anchor="middle" font-size="12" font-weight="600" fill="#7d4e00">窗口内 · 延后</text>

  <rect x="180" y="300" width="300" height="58" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.3"/>
  <text x="330" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">kill -TERM runner 子进程 → 重新拉起</text>
  <text x="330" y="343" text-anchor="middle" font-size="11" fill="#57606a">容器不动 · WebUI 进程不动 · 只换执行端</text>

  <rect x="510" y="300" width="300" height="58" rx="8" fill="#ffffff" stroke="#bf8700" stroke-width="1.3"/>
  <text x="660" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">PENDING=1，不打断正在签到的群</text>
  <text x="660" y="343" text-anchor="middle" font-size="11" fill="#57606a">00:40 后自动补做重载</text>

  <!-- 日志样例 -->
  <rect x="60" y="388" width="840" height="58" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="78" y="410" font-size="11" font-weight="700" fill="#57606a">在没有 /var/log/tg-signer-all.log 里看到这行：</text>
  <text x="78" y="431" font-size="11" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" fill="#1f2328">[2026-11-18 09:42:13] 配置变更 a1b2c3d4 -&gt; e5f6a7b8，重启 runner 使其生效</text>

  <defs>
    <marker id="tl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d0d7de"/></marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker>
    <marker id="or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bf8700"/></marker>
  </defs>
</svg>
